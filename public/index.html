<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>宝可梦卡牌学堂 · 简中官方规则对战</title>
  <link rel="stylesheet" href="vendor/fonts.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="rps.css">
  <link rel="stylesheet" href="account.css">
  <link rel="icon" href="img/academy-logo.svg">
</head>
<body>
  <header>
    <div class="brand">
      <img class="logo" src="img/academy-logo.svg" alt="宝可梦卡牌学堂">
      <div class="brand-text">
        <span class="title" data-i18n="ui.siteName">宝可梦卡牌学堂</span>
        <button class="badge" id="engine-badge"></button>
      </div>
    </div>
    <nav>
      <span id="site-nav"></span>
      <button id="btn-settings" class="icon-btn" data-i18n-title="ui.settings"><i class="ic ic-settings"></i></button>
      <button id="btn-rules"><i class="ic ic-book-open"></i> <span data-i18n="ui.rules"></span></button>
      <button id="btn-report" data-i18n-title="ui.reportTitle"><i class="ic ic-flag"></i> <span data-i18n="ui.report"></span></button>
      <button id="btn-new"><i class="ic ic-rotate-ccw"></i> <span data-i18n="ui.new"></span></button>
    </nav>
  </header>

  <main id="table" hidden>
    <section id="board">
      <div id="opp-hand"></div>
      <div class="mat opp">
        <div class="prizes" id="opp-prizes"></div>
        <div class="active-zone" id="opp-active"></div>
        <div class="bench" id="opp-bench"></div>
        <div class="piles" id="opp-piles"></div>
      </div>
      <div id="midbar">
        <div id="turn-info"></div>
        <button id="btn-log" class="mid-btn" aria-controls="log-panel" aria-expanded="false"><i class="ic ic-history"></i> <span data-i18n="ui.log"></span><b id="log-unread" hidden></b></button>
        <div id="stadium" hidden></div>
        <!-- The coach's pick and the Professor's word on your move; the replay's controls in a replay. -->
        <div id="hint"></div>
        <div id="opp-status"></div>
        <!-- Ending the turn (and taking back a quiet move) sits on the table, between the two mats. -->
        <div id="end-slot"></div>
      </div>
      <div class="mat you">
        <div class="prizes" id="you-prizes"></div>
        <div class="active-zone" id="you-active"></div>
        <div class="bench" id="you-bench"></div>
        <div class="piles" id="you-piles"></div>
      </div>
      <div id="hand-wrap">
        <div id="hand"></div>
      </div>
    </section>

    <!-- The game log: a column beside the board, opened and closed from the bar between the mats. -->
    <aside class="panel" id="log-panel" hidden>
      <div class="log-head"><h2 data-i18n="ui.log"></h2><button class="icon-btn" id="log-close" data-i18n-aria="ui.close"><i class="ic ic-x"></i></button></div>
      <div id="log"></div>
    </aside>
  </main>

  <div id="preview" hidden></div>

  <div id="settings" class="overlay" hidden>
    <div class="dialog settings" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <button class="close" id="settings-close" aria-label="Close" data-i18n-aria="ui.close"><i class="ic ic-x"></i></button>
      <h2 id="settings-title" data-i18n="ui.settings"></h2>
      <section class="set-sec">
        <h3 id="eng-title" data-i18n="eng.title"></h3>
        <div id="engine-box"></div>
      </section>
      <section class="set-sec">
        <h3 data-i18n="ui.play"></h3>
        <div class="set-row">
          <span id="opening-label" data-i18n="ui.opening"></span>
          <div class="dice-pick opening-pick" role="radiogroup" aria-labelledby="opening-label">
            <label><input type="radio" name="opening" value="rps"><span data-i18n="ui.openingRps"></span></label>
            <label><input type="radio" name="opening" value="coin"><span data-i18n="ui.openingCoin"></span></label>
          </div>
        </div>
        <label class="set-row"><span data-i18n="ui.autoPlay"></span><input type="checkbox" role="switch" id="opt-auto"></label>
      </section>
      <!-- The language-model coach, when the server has one. -->
      <section class="set-sec" id="llm-coach-row" hidden>
        <h3 data-i18n="ui.coach"></h3>
        <label class="set-row"><span data-i18n="ui.llmCoach"></span><input type="checkbox" role="switch" id="opt-llm-coach" checked></label>
      </section>
      <section class="set-sec">
        <h3 data-i18n="ui.display"></h3>
        <label class="set-row"><span data-i18n="ui.animate"></span><input type="checkbox" role="switch" id="opt-anim" checked></label>
        <div class="set-row">
          <span id="dice-label"></span>
          <div class="dice-pick" role="radiogroup" aria-labelledby="dice-label">
            <label><input type="radio" name="dice" value="counters"><span class="die-slot" data-die="counters" aria-hidden="true"></span><span data-i18n="ui.diceCounters"></span></label>
            <label><input type="radio" name="dice" value="pips"><span class="die-slot" data-die="pips" aria-hidden="true"></span><span data-i18n="ui.dicePips"></span></label>
            <label><input type="radio" name="dice" value="numbers"><span class="die-slot" data-die="numbers" aria-hidden="true"></span><span data-i18n="ui.diceNumbers"></span></label>
          </div>
        </div>
      </section>
    </div>
  </div>

  <div id="modal" class="overlay" hidden><div class="dialog" id="modal-body"></div></div>

  <div id="start" class="overlay start-screen">
    <div class="start-wrap">
      <div id="start-nav" class="start-nav"></div>
      <header class="start-hero">
        <img class="set-logo" src="img/academy-logo.svg" alt="宝可梦卡牌学堂">
        <div class="hero-text">
          <h2 data-i18n="ui.welcome"></h2>
          <p data-i18n-html="ui.welcomeText"></p>
          <p class="locale-note" data-i18n="ui.localeNote"></p>
        </div>
      </header>
      <div id="deck-choices"></div>
      <p class="deck-source" id="deck-source"></p>
      <p class="legal" data-i18n="ui.footer"></p>
    </div>
    <div class="start-bar">
      <div class="matchup">
        <span class="side you" id="match-you"></span>
        <span class="vs" aria-hidden="true">vs</span>
        <label class="side opp"><small data-i18n="pl.1"></small><select id="opt-opp" data-i18n-aria="ui.oppDeck"></select></label>
      </div>
      <div class="opts" id="start-engine"></div>
      <div class="bar-actions">
        <button class="textlink" id="start-rules"><span data-i18n="ui.readRules"></span></button>
        <button class="primary" id="btn-start" disabled></button>
      </div>
    </div>
  </div>

  <div id="playbook" class="overlay" hidden>
    <div class="dialog wide playbook" tabindex="-1" role="dialog" aria-labelledby="playbook-title">
      <button class="close" id="playbook-close" aria-label="Close" data-i18n-aria="ui.close"><i class="ic ic-x"></i></button>
      <h2 id="playbook-title"></h2>
      <div id="playbook-body"></div>
    </div>
  </div>

  <div id="rules" class="overlay" hidden>
    <div class="dialog wide rules">
      <button class="close" id="rules-close" aria-label="Close" data-i18n-aria="ui.close"><i class="ic ic-x"></i></button>
      <h2><span data-i18n="ui.rules"></span></h2>
      <div id="rules-body"></div>
      <p class="legal" data-i18n="ui.footer"></p>
    </div>
  </div>

  <script type="module" src="ui.js"></script>
</body>
</html>
